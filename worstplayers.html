<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worst Players</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <header>
        <h1>Worst Players List</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Shaco Game</a></li>
                <li><a href="contact.html">Contact us</a></li>
                <li><a href="Worstplayers.html">Worst Players</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Players</h2>
        <div id="playersList" class="players-container">
            <!-- Players will be loaded here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2024 La dupla fode teu jogo. All rights reserved.</p>
    </footer>

    <script>
        // Configuração Firebase (já existente no seu projeto)
        const firebaseConfig = {
            apiKey: "AIzaSyBPs6QPlgPLlANlccUeznhjCKM15Od7UUY",
            authDomain: "dupla-b36bb.firebaseapp.com",
            projectId: "dupla-b36bb",
            storageBucket: "dupla-b36bb.appspot.com",
            messagingSenderId: "1055171552696",
            appId: "1:1055171552696:web:f97369646e4d7c53c25b4d"
        };

        // Inicializar Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Função para carregar jogadores
        async function loadPlayers() {
            const playersList = document.getElementById("playersList");
            playersList.innerHTML = ""; // Limpar a lista

            try {
                const snapshot = await db.collection("Worst_Players").orderBy("timestamp", "desc").get();
                snapshot.forEach((doc) => {
                    const player = doc.data();
                    const playerDiv = document.createElement("div");
                    playerDiv.className = "player";
                    playerDiv.innerHTML = `
                        <h3>${player.name}</h3>
                        <img src="${player.image}" alt="${player.name}" style="width: 150px; border-radius: 10px;">
                        <p>${player.description}</p>
                    `;
                    playersList.appendChild(playerDiv);
                });
            } catch (error) {
                console.error("Error loading players: ", error);
            }
        }

        // Carregar jogadores ao abrir a página
        loadPlayers();
    </script>
</body>
</html>
