<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worst Players</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <header>
        <h1>Worst Players List</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Shaco Game</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="Worstplayers.html">Worst Players</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>WORST PISSELOS IN LEAGUE OF LEGENDS WORLD WIDE. TRASHEST OF TRASH</h2>
        <div id="playersList" class="players-container">
            <!-- Players will be loaded here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2024 La dupla fode teu jogo. All rights reserved.</p>
    </footer>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBPs6QPlgPLlANlccUeznhjCKM15Od7UUY",
            authDomain: "dupla-b36bb.firebaseapp.com",
            projectId: "dupla-b36bb",
            storageBucket: "dupla-b36bb.appspot.com",
            messagingSenderId: "1055171552696",
            appId: "1:1055171552696:web:f97369646e4d7c53c25b4d"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Function to like a player
        async function likePlayer(playerId) {
            const playerRef = db.collection("Worst_Players").doc(playerId);

            try {
                await playerRef.update({
                    likes: firebase.firestore.FieldValue.increment(1) // Increment likes by 1
                });
                loadPlayers(); // Reload players after updating likes
            } catch (error) {
                console.error("Error updating likes: ", error);
            }
        }

        // Function to load players
        async function loadPlayers() {
            const playersList = document.getElementById("playersList");
            playersList.innerHTML = ""; // Clear the list

            try {
                const snapshot = await db.collection("Worst_Players")
                                         .orderBy("likes", "desc")
                                         .get();
                snapshot.forEach((doc) => {
                    const player = doc.data();
                    const playerDiv = document.createElement("div");
                    playerDiv.className = "player";
                    playerDiv.innerHTML = `
                        <h3>${player.name}</h3>
                        <img src="${player.image}" alt="${player.name}" style="width: 150px; border-radius: 10px;">
                        <p>${player.description}</p>
                        <p>Likes: <span id="likes-${doc.id}">${player.likes || 0}</span></p>
                        <button onclick="likePlayer('${doc.id}')">Like</button>
                    `;
                    playersList.appendChild(playerDiv);
                });
            } catch (error) {
                console.error("Error loading players: ", error);
            }
        }

        // Load players on page load
        loadPlayers();
    </script>
</body>
</html>
